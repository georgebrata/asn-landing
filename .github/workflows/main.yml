# PROD Workflow for avocat-nagy-cluj.ro
name: CI Main -> avocat-nagy-cluj.ro

# Deploy only from main: a push after merge, or a manual dispatch on main.
# Pull requests, including forks, must not run this job or receive deploy secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys so two FTP syncs never overlap.
concurrency:
  group: ftp-deploy-avocat-nagy-cluj
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cd:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: glc38.hostico.ro
          username: deploy@avocat-nagy-cluj.ro
          password: ${{secrets.FTP_PASSWORD}}
          protocol: ftps
          security: strict
          local-dir: ./
          # First post-merge run validates FTPS and prints the sync plan only.
          # Set dry-run to false after that run succeeds.
          dry-run: true
          timeout: 60000
          exclude: |
            **/.DS_Store
            .vscode/**
            .prettierrc
            .ftp-deploy-sync-state.json
            .git*/**
